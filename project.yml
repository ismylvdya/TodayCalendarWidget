name: TodayCalendarWidget
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TodayCalendarWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: TodayCalendarWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chumbulev.TodayCalendarWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "Calendar Widget"
        PRODUCT_MODULE_NAME: CalendarWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Calendar Widget"
        LSUIElement: true
        NSAppleEventsUsageDescription: Opens Calendar on today's date when you click the widget.
        NSCalendarsFullAccessUsageDescription: Виджет показывает события сегодняшнего дня.
        CFBundleURLTypes:
          - CFBundleURLName: com.chumbulev.TodayCalendarWidget
            CFBundleURLSchemes: [todaycalendarwidget]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.apple-events: [com.apple.iCal]
        com.apple.security.personal-information.calendars: true
  TodayCalendarWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chumbulev.TodayCalendarWidget.Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Calendar Widget"
        NSCalendarsFullAccessUsageDescription: Виджет показывает события сегодняшнего дня.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
  TripleTodayiOS:
    type: application
    platform: iOS
    sources: [iOSApp, Shared, AppUI]
    dependencies:
      - target: TripleTodayiOSWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chumbulev.TripleToday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: TripleToday
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: "Cal Enh & Hab"
        NSCalendarsFullAccessUsageDescription: The widget shows today's calendar events.
        NSRemindersFullAccessUsageDescription: Completed reminders are added to your habit history.
        ALTAppGroups: [group.com.chumbulev.TripleToday]
        CFBundleURLTypes:
          - CFBundleURLName: com.chumbulev.TripleToday
            CFBundleURLSchemes: [todaycalendarwidget]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOSApp/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chumbulev.TripleToday]
  TripleTodayiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist, "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chumbulev.TripleToday.Widget
        PRODUCT_NAME: TripleTodayWidget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: "Cal Enh & Hab"
        NSCalendarsFullAccessUsageDescription: The widget shows today's calendar events.
        NSRemindersFullAccessUsageDescription: Completed reminders are added to your habit history.
        ALTAppGroups: [group.com.chumbulev.TripleToday]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOSWidget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chumbulev.TripleToday]
